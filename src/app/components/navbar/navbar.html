<p-toolbar [ngClass]="{ 'navbar-scrolled': scrolled() }">
  <ng-template #start>
    <img src="logo.png" alt="AK Logo" />
  </ng-template>
  <ng-template #end>
    <a href="#hero" i18n>Hero</a>
    <a href="#about" i18n>About</a>
    <a href="#philosophy" i18n>Philosophie</a>
    <a href="#services" i18n>Leistungen</a>
    <a href="#projects" i18n>Projekte</a>
    <a href="#contact" i18n>Kontakte</a>
    <app-lang-switch />
    <app-theme-toggle />
  </ng-template>
</p-toolbar>
